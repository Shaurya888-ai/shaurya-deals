<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details | Shaurya Deals</title>

<meta name="description" content="Product details and affiliate recommendations.">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">

    <div class="logo">
        Shaurya Deals
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<main class="product-details-container">

    <div class="product-image-section">

        <img
            id="productImage"
            src=""
            alt="Product"
        >

    </div>

    <div class="product-info-section">

        <h1 id="productName">
            Loading...
        </h1>

        <p id="productDescription">
            Please wait...
        </p>

        <a
            id="buyButton"
            href="#"
            target="_blank"
            class="btn"
        >
            Buy Now
        </a>

    </div>

</main>

<section class="related-products-section">

    <h2>Related Products</h2>

    <div
        id="relatedProducts"
        class="product-grid"
    ></div>

</section>

<footer>

    <div class="footer-links">

        <a href="privacy-policy.html">
            Privacy Policy
        </a>

        <a href="disclaimer.html">
            Disclaimer
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

    </div>

    <p>
        © 2026 Shaurya Deals
    </p>

</footer>

<script type="module">

import { db } from "./firebase-config.js";

import {
    doc,
    getDoc,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const params =
    new URLSearchParams(
        window.location.search
    );

const productId =
    params.get("id");

async function loadProduct() {

    if (!productId) return;

    const ref =
        doc(
            db,
            "products",
            productId
        );

    const snap =
        await getDoc(ref);

    if (!snap.exists()) return;

    const product =
        snap.data();

    document
        .getElementById("productName")
        .textContent =
        product.name;

    document
        .getElementById("productDescription")
        .textContent =
        product.description;

    document
        .getElementById("productImage")
        .src =
        product.imageUrl;

    document
        .getElementById("buyButton")
        .href =
        product.affiliateLink;

    loadRelatedProducts();
}

async function loadRelatedProducts() {

    const container =
        document.getElementById(
            "relatedProducts"
        );

    const snapshot =
        await getDocs(
            collection(
                db,
                "products"
            )
        );

    container.innerHTML = "";

    snapshot.forEach(item => {

        const p =
            item.data();

        container.innerHTML += `
        <div class="product-card">

            <img
                src="${p.imageUrl}"
                alt="${p.name}"
            >

            <h3>${p.name}</h3>

            <a
              href="product-details.html?id=${item.id}"
              class="btn"
            >
              View Product
            </a>

        </div>
        `;

    });

}

loadProduct();

</script>

</body>
</html>
